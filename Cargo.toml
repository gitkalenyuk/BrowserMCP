[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned exactly: crate version tracks a specific CEF build (156.0.15 / Chromium 156).
# Bump monthly with `cargo xtask bump-cef` (planned), then run the e2e tests.
cef = { version = "=156.3.0", default-features = false }

bmcp-core = { path = "crates/core" }
bmcp-cef = { path = "crates/cef" }
bmcp-cdp = { path = "crates/cdp" }
bmcp-api = { path = "crates/api" }
bmcp-browser = { path = "crates/browser" }
bmcp-perception = { path = "crates/perception" }
bmcp-registry = { path = "crates/registry" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-util = "0.7"
axum = "0.8"
rmcp = { version = "=3.9.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.dev]
# CEF itself is prebuilt; keep our own code fast to compile.
debug = "line-tables-only"

# Hot paths that are painfully slow unoptimized even in dev builds (adblock decision per
# request: ~31 ms at opt-level 0 vs ~0.5 ms at 3).
[profile.dev.package.adblock]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
