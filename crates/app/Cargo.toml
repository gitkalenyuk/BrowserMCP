[package]
name = "browsermcp"
description = "BrowserMCP: a browser that people and AI agents both drive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "browsermcp"
path = "src/main.rs"

[dependencies]
bmcp-core.workspace = true
bmcp-cef.workspace = true
bmcp-api.workspace = true
bmcp-browser.workspace = true
bmcp-ai = { path = "../ai" }
bmcp-net = { path = "../net" }
bmcp-data = { path = "../data" }
bmcp-identity = { path = "../identity" }
bmcp-record = { path = "../record" }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Blocking HTTP client for the mcp-stdio proxy (localhost only, so no TLS).
ureq = { version = "3.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
