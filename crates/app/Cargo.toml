[package]
name = "browsermcp"
description = "BrowserMCP: a browser that people and AI agents both drive"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "browsermcp"
path = "src/main.rs"

[dependencies]
bmcp-core.workspace = true
bmcp-cef.workspace = true
bmcp-api.workspace = true
bmcp-registry.workspace = true
# DataStore (SQLite) is opened by the app; its commands are registered in bmcp-registry.
bmcp-ai = { path = "../ai" }
bmcp-data = { path = "../data" }
bmcp-identity = { path = "../identity" }
bmcp-record = { path = "../record" }
bmcp-jobs = { path = "../jobs" }
# Adblock gate and permission rules are created before the browser starts.
bmcp-adblock = { path = "../adblock" }
bmcp-profiles = { path = "../profiles" }
bmcp-plugins = { path = "../plugins" }
bmcp-governor = { path = "../governor" }
# Dialog watcher (Page.enable + auto-handling on every tab); commands are in bmcp-registry.
bmcp-pagetools = { path = "../pagetools" }
bmcp-heal = { path = "../heal" }
bmcp-notify = { path = "../notify" }
bmcp-hints = { path = "../hints" }
# Languages service (data/config/languages.json), applied through the CEF backend.
bmcp-languages = { path = "../languages" }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Blocking HTTP client for the mcp-stdio proxy (localhost only, so no TLS).
ureq = { version = "3.5", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
