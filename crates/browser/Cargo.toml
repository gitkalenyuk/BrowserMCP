[package]
name = "bmcp-browser"
description = "BrowserMCP page control: snapshot/find/act/diff/read/screenshot, history navigation, waits and keys (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
bmcp-perception.workspace = true
# Target.setAutoAttach is shared with identity tabs (worker pausing).
bmcp-cdpshare = { path = "../cdpshare" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
# `test-util` lets tests run with a paused clock, so waits and retries take no real time.
tokio = { workspace = true, features = ["test-util"] }
