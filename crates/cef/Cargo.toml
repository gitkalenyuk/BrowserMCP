[package]
name = "bmcp-cef"
description = "The only BrowserMCP crate that talks to CEF: process startup, windows, views, handlers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
bmcp-cdp.workspace = true
# The ResourceGate (adblock + site policies) asked from OnBeforeResourceLoad.
bmcp-adblock = { path = "../adblock" }
# Profile settings, cookie/permission/download policies (all CEF-free, see that crate).
bmcp-profiles = { path = "../profiles" }
# Topic names of the download events (recorded by bmcp-data).
bmcp-data = { path = "../data" }
# Website languages, Chromium locale, spellcheck (data/config/languages.json).
bmcp-languages = { path = "../languages" }
cef.workspace = true
# CSP hash of the config script injected into our UI pages.
sha2 = "0.11"
base64 = "0.22"
# Embeds the Svelte UI build (ui/dist) into the executable, see src/ui_files.rs.
include_dir = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Plain-text clipboard for the page context menu ("Copy link address"), see src/clipboard.rs.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }
