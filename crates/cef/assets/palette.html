<!doctype html>
<!--
  Spike S1 placeholder for the Ctrl+K palette (served as bmcp://ui/palette.html), shown in
  a Views overlay over the page. The Svelte UI replaces it in Phase 2.
  Browser -> page: window.bmcp.onShow() each time the overlay opens.
  Esc is handled by the browser (KeyboardHandler) and hides the overlay.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrowserMCP palette</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #292a2d;
    color: #e8eaed; font: 14px "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; border: 1px solid #5f6368; }
  input { height: 52px; border: 0; border-bottom: 1px solid #3c4043; padding: 0 18px;
    background: none; color: inherit; font: 16px inherit; font-family: inherit; outline: none; }
  ul { list-style: none; margin: 0; padding: 6px 0; overflow: auto; flex: 1; }
  li { padding: 9px 18px; display: flex; justify-content: space-between; cursor: pointer; }
  li.sel { background: #3c4043; }
  kbd { color: #9aa0a6; font: 12px inherit; font-family: inherit; }
  footer { padding: 8px 18px; color: #9aa0a6; font-size: 12px; border-top: 1px solid #3c4043; }
</style>
</head>
<body>
  <input id="q" placeholder="Type a command or a URL" spellcheck="false" autocomplete="off">
  <ul id="list"></ul>
  <footer>Enter to run &middot; &uarr;&darr; to move &middot; Esc to close</footer>
<script>
  const cmd = (name, args) =>
    fetch("bmcp://cmd/" + name + (args ? "?" + new URLSearchParams(args) : ""))
      .catch((e) => console.error("bmcp command failed", name, e));

  const COMMANDS = [
    { label: "Back", keys: "Alt+Left", run: () => cmd("back") },
    { label: "Forward", keys: "Alt+Right", run: () => cmd("forward") },
    { label: "Reload", keys: "F5", run: () => cmd("reload") },
    { label: "Open example.com", keys: "", run: () => cmd("navigate", { url: "example.com" }) },
    { label: "Open Wikipedia", keys: "", run: () => cmd("navigate", { url: "en.wikipedia.org" }) },
  ];
  const q = document.getElementById("q");
  const list = document.getElementById("list");
  let items = [];
  let sel = 0;

  function render() {
    const text = q.value.trim();
    items = COMMANDS.filter((c) => c.label.toLowerCase().includes(text.toLowerCase()));
    if (text) items.unshift({ label: "Go to “" + text + "”", keys: "Enter",
      run: () => cmd("navigate", { url: text }) });
    sel = Math.min(sel, Math.max(items.length - 1, 0));
    list.replaceChildren(...items.map((c, i) => {
      const li = document.createElement("li");
      li.className = i === sel ? "sel" : "";
      li.innerHTML = "<span></span><kbd></kbd>";
      li.firstChild.textContent = c.label;
      li.lastChild.textContent = c.keys;
      li.onmousedown = (e) => { e.preventDefault(); run(i); };
      return li;
    }));
  }

  function run(i) {
    const item = items[i];
    if (!item) return;
    item.run();
    cmd("palette", { action: "hide" });
  }

  q.oninput = () => { sel = 0; render(); };
  q.onkeydown = (e) => {
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, items.length - 1); render(); e.preventDefault(); }
    if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); e.preventDefault(); }
    if (e.key === "Enter") run(sel);
  };

  window.bmcp = {
    onShow() {
      q.value = "";
      sel = 0;
      render();
      q.focus();
    },
  };
  render();
</script>
</body>
</html>
