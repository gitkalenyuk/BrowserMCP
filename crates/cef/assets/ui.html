<!doctype html>
<!--
  Spike S1 placeholder for the browser chrome (served as bmcp://ui/index.html).
  The Svelte UI (ui/) replaces it in Phase 2.

  Channel (temporary, Phase 3 replaces it with the WS API):
    page -> browser : fetch("bmcp://cmd/<name>?<args>")   (see crates/cef/src/chrome/protocol.rs)
    browser -> page : window.bmcp.onState({url, title, loading, canGoBack, canGoForward})
                      window.bmcp.focusUrl()               (Ctrl+L)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrowserMCP UI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #202124; --tab: #35363a; --field: #2b2c2f; --text: #e8eaed;
    --muted: #9aa0a6; --accent: #8ab4f8; --hover: #3c4043;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
  .tabs { height: 34px; display: flex; align-items: flex-end; padding: 0 8px; }
  .tab { height: 30px; max-width: 240px; min-width: 120px; padding: 0 12px;
    display: flex; align-items: center; gap: 8px; background: var(--tab);
    border-radius: 8px 8px 0 0; white-space: nowrap; overflow: hidden; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .loading .dot { background: var(--accent); animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { opacity: .3; } }
  .bar { height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 8px;
    background: var(--tab); }
  button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: none;
    color: var(--text); font-size: 17px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { color: #5f6368; cursor: default; }
  form { flex: 1; display: flex; }
  input { flex: 1; height: 32px; border: 1px solid transparent; border-radius: 16px;
    padding: 0 14px; background: var(--field); color: var(--text); font: inherit;
    outline: none; user-select: text; }
  input:focus { border-color: var(--accent); background: #202124; }
  #palette { width: auto; padding: 0 12px; border-radius: 16px; font-size: 12px;
    color: var(--muted); border: 1px solid #5f6368; }
</style>
</head>
<body>
  <div class="tabs"><div class="tab" id="tab"><div class="dot"></div><span id="title">New Tab</span></div></div>
  <div class="bar">
    <button id="back" title="Back (Alt+Left)" disabled>&#8592;</button>
    <button id="forward" title="Forward (Alt+Right)" disabled>&#8594;</button>
    <button id="reload" title="Reload (F5)">&#8635;</button>
    <form id="form"><input id="url" spellcheck="false" autocomplete="off"
      placeholder="Search or type a URL"></form>
    <button id="palette" title="Command palette (Ctrl+K)">Ctrl+K</button>
  </div>
<script>
  // Fire-and-forget command to the browser process.
  const cmd = (name, args) =>
    fetch("bmcp://cmd/" + name + (args ? "?" + new URLSearchParams(args) : ""))
      .catch((e) => console.error("bmcp command failed", name, e));

  const $ = (id) => document.getElementById(id);
  let state = { url: "", title: "", loading: false };

  window.bmcp = {
    onState(s) {
      state = s;
      $("title").textContent = s.title || s.url || "New Tab";
      $("tab").classList.toggle("loading", s.loading);
      $("back").disabled = !s.canGoBack;
      $("forward").disabled = !s.canGoForward;
      $("reload").innerHTML = s.loading ? "&#10005;" : "&#8635;";
      $("reload").title = s.loading ? "Stop" : "Reload (F5)";
      // Do not overwrite what the user is typing. Pitfall: when the page view takes
      // focus, activeElement here stays the input; only document.hasFocus() changes.
      const typing = document.hasFocus() && document.activeElement === $("url");
      if (!typing) $("url").value = s.url;
    },
    focusUrl() {
      $("url").focus();
      $("url").select();
    },
  };

  $("back").onclick = () => cmd("back");
  $("forward").onclick = () => cmd("forward");
  $("reload").onclick = () => cmd(state.loading ? "stop" : "reload");
  $("palette").onclick = () => cmd("palette", { action: "toggle" });
  $("form").onsubmit = (e) => {
    e.preventDefault();
    cmd("navigate", { url: $("url").value });
  };
  $("url").onkeydown = (e) => {
    if (e.key === "Escape") {
      $("url").value = state.url;
      cmd("focus-content");
    }
  };
  $("url").onfocus = () => setTimeout(() => $("url").select(), 0);
  cmd("ready");
</script>
</body>
</html>
