[package]
name = "bmcp-core"
description = "BrowserMCP core: domain model, portable paths, command registry (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `bmcp_core::testing` (FakeBackend) to other crates' tests.
testing = []

[dependencies]
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
thiserror.workspace = true
# INFO logs of who closed tabs/windows (for "unexplained shutdown" diagnosis).
tracing.workspace = true
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tempfile.workspace = true
