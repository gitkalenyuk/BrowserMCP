[package]
name = "bmcp-governor"
description = "BrowserMCP resource governor: tab freezing/discarding and automatic limits from RAM/CPU (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Total/available RAM and the working set of our own process tree (renderers, GPU, …).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `test-util`: paused clock, so "5 minutes in the background" takes no real time.
tokio = { workspace = true, features = ["test-util"] }
