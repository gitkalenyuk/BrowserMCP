[package]
name = "bmcp-languages"
description = "BrowserMCP: languages for websites (Accept-Language / navigator.languages), Chromium's own locale and spellcheck dictionaries, stored in data/config/languages.json (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows display language: the automatic website languages before the UI reports its own.
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio.workspace = true
