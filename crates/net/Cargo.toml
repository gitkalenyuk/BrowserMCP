[package]
name = "bmcp-net"
description = "BrowserMCP traffic: capture, HAR, rules/mocks, breakpoints, replay, API-to-code (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
# Shared CDP session: domain refcount + the per-tab Fetch coordinator.
bmcp-cdpshare = { path = "../cdpshare" }
base64 = "0.22"
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
# `test-util` lets tests run with a paused clock (breakpoint auto-continue after 60 s).
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
