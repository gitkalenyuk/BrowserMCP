[package]
name = "bmcp-pagetools"
description = "BrowserMCP page tools: JavaScript dialogs (+ auto policy), file upload, print to PDF / MHTML, find in page (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
# Ref resolution (`@4:e3` → DOM node) through the browser crate's per-tab ref registry.
bmcp-browser.workspace = true
bmcp-perception.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Page.printToPDF returns the file as base64.
base64 = "0.22"

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
# `test-util`: paused clock, so timeouts in the tests take no real time.
tokio = { workspace = true, features = ["test-util"] }
