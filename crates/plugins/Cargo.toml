[package]
name = "bmcp-plugins"
description = "BrowserMCP extensions: TypeScript plugins (long-lived, permission-checked), userscripts on page loads, signed webhook triggers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
# The restricted plugin connection (`access::PluginAuth`) and the webhook route contract.
bmcp-api.workspace = true
# Finding and running `bmcp-script-host` (userscripts reuse `host::run_host`).
bmcp-jobs = { path = "../jobs" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
# Webhook signatures (HMAC-SHA256 is built on it in webhooks.rs; same version as the rest of
# the workspace, so nothing new is downloaded).
sha2 = "0.11"
# Plugin tokens and generated webhook secrets.
getrandom = "0.3"

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs", "test-util"] }
