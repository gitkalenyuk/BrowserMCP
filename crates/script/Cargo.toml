[package]
name = "bmcp-script"
description = "BrowserMCP script host: runs user TypeScript in an embedded V8 (deno_core) sidecar process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bmcp-script-host"
path = "src/main.rs"

# Every version below is pinned EXACTLY (`=x.y.z`): deno_core ships a breaking
# release almost every week, and deno_core / deno_ast / deno_error must stay a
# matching set (deno_core 0.413.0 itself tests against deno_ast 0.53.3 and pins
# deno_error 0.7.1). Bump them together, on purpose, then run the tests.
[dependencies]
# V8 + the op/module/event-loop machinery. Pulls the prebuilt rusty_v8 static
# library (crate `deno_v8`) on first build (~100+ MB download).
deno_core = "=0.413.0"
# TypeScript -> JavaScript transpiling (swc under the hood), with source maps.
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
# Error type ops return so JS sees a proper `Error`.
deno_error = "=0.7.1"
# Async runtime that drives the V8 event loop (deno_core requires tokio).
tokio = { version = "=1.54.1", features = ["rt", "time", "macros", "sync"] }
# WebSocket client for the (not yet existing) browser JSON-RPC endpoint.
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect"] }
anyhow = "=1.0.104"

[lints.rust]
unsafe_code = "forbid"
