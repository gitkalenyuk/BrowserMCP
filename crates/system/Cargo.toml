[package]
name = "bmcp-system"
description = "BrowserMCP: show a file or folder in Windows Explorer (system.reveal_path / system.open_path), limited to the data folder and Downloads (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
