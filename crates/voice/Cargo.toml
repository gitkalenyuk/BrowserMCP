[package]
name = "bmcp-voice"
description = "BrowserMCP voice dictation: speech-to-text engines (local Whisper sidecar, OpenAI, Groq, ElevenLabs, Deepgram, custom), model downloads, settings in data/config/voice.json (no CEF dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bmcp-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio-util.workspace = true
# `process`: the whisper-server sidecar; `fs` + `io-util`: downloads written as they arrive.
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time", "net", "macros"] }
# HTTPS to the speech APIs, GitHub and Hugging Face (the same build as bmcp-ai: rustls + ring).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
# Downloads are checked against the SHA-256 their source publishes.
sha2 = "0.11"
# The whisper.cpp Windows build is a zip (same features as xtask, so it is built once).
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Deepgram live transcription over WebSocket (the version axum uses); TLS through our own
# rustls config with the ring provider and the Mozilla roots.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
# Job Object: the whisper-server sidecar dies with the browser, even when the browser crashes.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
bmcp-core = { workspace = true, features = ["testing"] }
# Mock speech APIs and download servers: the tests never call a paid engine.
wiremock = "0.6"
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time", "net", "macros", "rt-multi-thread"] }
