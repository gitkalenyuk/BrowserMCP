<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow DOM – Fixture</title>
<style>
  body { font-family: sans-serif; margin: 40px; }
</style>
</head>
<!--
  Controls inside an open shadow root, a nested shadow root and a closed one. Snapshots, clicks
  (hit test across shadow boundaries), fills and page.read must all reach them.
-->
<body>
<main>
  <h1>Shadow</h1>
  <x-card id="card"></x-card>
  <x-closed id="closed"></x-closed>
</main>
<script>
  customElements.define('x-inner', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // The button's label is a <span>: the hit test lands on the span, deep inside.
      root.innerHTML = '<button id="deep"><span>Deep button</span></button><p id="deep-status"></p>';
      root.getElementById('deep').onclick = () => {
        root.getElementById('deep-status').textContent = 'deep clicked';
      };
    }
  });
  customElements.define('x-card', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = `
        <section aria-label="Card">
          <p>Text inside the shadow root.</p>
          <label>Name <input id="name"></label>
          <button id="save">Save</button>
          <p id="card-status" role="status"></p>
          <x-inner></x-inner>
        </section>`;
      root.getElementById('save').onclick = () => {
        root.getElementById('card-status').textContent = 'saved ' + root.getElementById('name').value;
      };
    }
  });
  customElements.define('x-closed', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'closed' });
      root.innerHTML = '<button id="hidden-away">Closed button</button><p id="closed-status"></p>';
      root.getElementById('hidden-away').onclick = () => {
        root.getElementById('closed-status').textContent = 'closed clicked';
      };
    }
  });
</script>
</body>
</html>
